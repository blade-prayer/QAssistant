[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qassistant"
version = "0.2.0"
description = "QAssistant: multi-agent financial research automation CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "dill>=0.3",
    "json-repair>=0.20",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pdfplumber>=0.10",
    "python-docx>=1.0",
    "chardet>=5.0",
    "PyYAML>=6.0",
    "yfinance>=0.2",
    "fredapi>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
web = [
    "crawl4ai>=0.3",
    "playwright>=1.40",
    "fake-useragent>=1.4",
]

[project.scripts]
QAssistant = "src.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
